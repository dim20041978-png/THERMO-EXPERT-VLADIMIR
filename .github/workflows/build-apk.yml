
name: THERMO EXPERT VLADIMIR - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o "THERMO_EXPERT_VLADIMIR_AndroidProject(1).zip" -d extracted
          cp -a extracted/THERMO_EXPERT_VLADIMIR_AndroidProject/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Fix FileProvider crash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, count = re.subn(
              r'<provider\b[^>]*android:name="androidx\.core\.content\.FileProvider"[^>]*>.*?</provider>',
              '',
              s,
              flags=re.DOTALL
          )
          if count != 1:
              raise SystemExit("FileProvider entry not found")
          p.write_text(s)

          g = Path("app/build.gradle")
          s = g.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 2", s)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '1.0.1'", s)
          g.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THERMO-EXPERT-VLADIMIR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
